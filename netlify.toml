[build]
  publish = "Messon_Eiffel"
  command = "mkdir -p Messon_Eiffel/assets/js && printf 'const SUPABASE_URL = \"%s\";\nconst SUPABASE_ANON_KEY = \"%s\";\n' \"$SUPABASE_URL\" \"$SUPABASE_ANON_KEY\" > Messon_Eiffel/assets/js/config.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
